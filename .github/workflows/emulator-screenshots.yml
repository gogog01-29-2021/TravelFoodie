name: Emulator screenshots

# Builds the debug APK, boots an Android emulator, walks through the bottom-nav tabs
# and uploads screenshots as a workflow artifact. No real secrets are used: CI-only
# placeholder keys are written to local.properties (gitignored), so the Google map
# renders without tiles and remote data (Places/Kakao/Naver) will be empty.

on:
  push:
    branches: ["ci/screenshots"]
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: CI-only placeholder keys (not real credentials)
        run: |
          {
            echo "MAPS_API_KEY=CI_PLACEHOLDER"
            echo "KAKAO_API_KEY=0123456789abcdef0123456789abcdef"
            echo "NAVER_CLIENT_ID=ci-placeholder"
            echo "NAVER_CLIENT_SECRET=ci-placeholder"
          } > local.properties

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Boot emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/screenshots.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn
