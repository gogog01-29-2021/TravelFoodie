name: Android CI

# Compiles the app (debug + unit tests + minified release) and smoke-tests the minified
# release APK on an emulator. Uses CI-only placeholder keys, never real secrets, because
# the unsigned APK is uploaded as an artifact and artifacts of a public repo are readable.

on:
  push:
    branches: [main, "feat/**", "ci/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Debug, unit tests, minified release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: CI-only placeholder keys (not real credentials)
        run: |
          {
            echo "MAPS_API_KEY=CI_PLACEHOLDER"
            echo "KAKAO_API_KEY=0123456789abcdef0123456789abcdef"
            echo "NAVER_CLIENT_ID=ci-placeholder"
            echo "NAVER_CLIENT_SECRET=ci-placeholder"
          } > local.properties

      - name: Build debug, run unit tests, build minified release
        run: ./gradlew :app:assembleDebug testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Upload R8 diagnostics (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: r8-diagnostics
          path: app/build/outputs/mapping/release/
          if-no-files-found: ignore

      - name: Upload R8 mapping (lets obfuscated crash stack traces be decoded)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload unsigned release APK for the smoke test
        uses: actions/upload-artifact@v4
        with:
          name: release-unsigned
          path: app/build/outputs/apk/release/*.apk
          retention-days: 1
          if-no-files-found: error

  smoke:
    name: Release APK smoke test (emulator)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-unsigned
          path: unsigned

      - name: Sign with a throwaway CI key (so the emulator can install it)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" -storepass android -keypass android \
            -alias ci -keyalg RSA -keysize 2048 -validity 2 -dname "CN=CI Smoke Test"
          "$BT/zipalign" -f -p 4 unsigned/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ci.jks" --ks-pass pass:android \
            --out "$RUNNER_TEMP/app-release-ci.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/app-release-ci.apk" | head -3

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, walk the tabs, fail on crash
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK: ${{ runner.temp }}/app-release-ci.apk
          OUT: screenshots-release
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/screenshots.sh

      - name: Upload smoke-test screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-release
          path: screenshots-release/
          if-no-files-found: warn
